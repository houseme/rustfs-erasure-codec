[default]
# Preserve exact abbreviated Git IDs emitted by benchmark metadata.
extend-ignore-re = [
    '"git_revision"\s*:\s*"[0-9a-f]{7,40}"',
    '(?m)^index [0-9a-f]{7,40}\.\.[0-9a-f]{7,40}(?: [0-9]{6})?$',
    # Exact hexadecimal witnesses in the field-operation diagnostics.
    'sequence=[0-9a-f]{16}\b',
]

[default.extend-words]
seh = "seh"
flate = "flate"

[files]
# Literal AArch64 disassembly contains the `ands` instruction mnemonic.
extend-exclude = ["benchmarks/gf8-small-verify/2026-11-01/stack-screen/prologues.txt"]
