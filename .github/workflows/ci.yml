name: CI

on:
  push:
    branches:
      - houseme/erasure-codec-review-fixes
      - houseme/release-*
      - main
      - 'feature/**'
      - 'refactor/**'
      - 'fix/**'
      - beta
    tags:
      - "v*"
      - "[0-9]*"
  pull_request:
    branches:
      - main
      - 'feature/**'
      - 'refactor/**'
      - 'fix/**'
      - beta
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      release_preflight:
        description: Run strict preflight before creating a release tag (never publishes)
        type: boolean
        default: false
      evidence_ref:
        description: Full commit of the controlled evidence snapshot (defaults to repository variable)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -C link-dead-code

jobs:
  typos:
    name: Typos
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7

      - name: Run typos
        uses: crate-ci/typos@v1.46.2 # v1.46.2

  security:
    name: Security (cargo-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable # v1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1 # v2.9.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit

  release-tooling:
    name: Release tooling and package dry-run
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Test benchmark and release gates
        run: |
          python3 scripts/check_release_manifest.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          bash -n scripts/release-check.sh

      - name: Compile and test the shared external duration sampler
        run: python3 scripts/release_sampling.py --check

      - name: Verify page-controlled slice fixtures without performance capture
        run: python3 scripts/diagnose_verify_layout.py --check

      - name: Verify ordinary sampler telemetry has no Rust heap activity
        run: python3 scripts/check_sampler_telemetry.py

      - name: Compile and test the isolated ShardSlot diagnostic
        run: python3 scripts/diagnose_shard_slot.py --check

      - name: Compile and test the post-construction CPU placement diagnostic
        run: python3 scripts/diagnose_cpu_placement.py --check

      - name: Compare published 9.0.0 encoding and allocation requests
        env:
          RAYON_NUM_THREADS: "4"
          RS_PARALLEL_POLICY_MAX_JOBS: "4"
        run: >-
          cargo run --locked --quiet --release
          --manifest-path scripts/release-compatibility/Cargo.toml --target-dir target
          -- --allocation-report "$RUNNER_TEMP/codec-resources-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"

      - name: Preserve codec resource comparison (not release performance evidence)
        uses: actions/upload-artifact@v7
        with:
          name: codec-resource-counts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codec-resources-*.json
          if-no-files-found: error

      - name: Verify the actual distributable without uploading
        run: cargo publish --dry-run --locked --registry crates-io --package rustfs-erasure-codec

  wasm-integration:
    name: WASM generated bindings (Node and Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTFLAGS: ""
    defaults:
      run:
        working-directory: wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: wasm/package-lock.json

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Install matching wasm-bindgen CLI
        working-directory: .
        run: |
          version="$(python3 -c 'import tomllib; p=tomllib.load(open("Cargo.lock", "rb")); print(next(x["version"] for x in p["package"] if x["name"] == "wasm-bindgen"))')"
          cargo install wasm-bindgen-cli --version "${version}" --locked

      - name: Install locked JavaScript development tools
        run: npm ci --ignore-scripts

      - name: Build complete generated package
        run: npm run build

      - name: Check TypeScript contracts
        run: npm run typecheck

      - name: Test real WASM in Node.js
        run: npm run test:node

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test real WASM in Chromium
        run: npm run test:browser

  build-linux:
    name: Build Linux (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ stable, beta, nightly ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master # v1
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1 # v2.9.1

      - name: Build all crates
        run: cargo build --verbose --workspace --exclude rustfs-erasure-codec-fuzz

  build-windows-native:
    name: Build Windows Native (${{ matrix.toolchain }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ stable, beta, nightly ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master # v1
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1 # v2.9.1

      - name: Build all crates
        run: cargo build --verbose --workspace --exclude rustfs-erasure-codec-fuzz

  build-windows-gnu-targets:
    name: Build Windows GNU Target (${{ matrix.toolchain }}, ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ stable, beta, nightly ]
        target: [ i686-pc-windows-gnu, x86_64-pc-windows-gnu ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7

      - name: Install Rust with target
        uses: dtolnay/rust-toolchain@master # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.target }}

      - name: Install MinGW cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 g++-mingw-w64

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1 # v2.9.1

      - name: Check target build (default features)
        run: cargo check --verbose --workspace --exclude rustfs-erasure-codec-fuzz --target ${{ matrix.target }}

      - name: Check target build (no default features)
        run: cargo check --verbose -p rustfs-erasure-codec --target ${{ matrix.target }} --no-default-features

      - name: Check target build (simd-accel)
        run: cargo check --verbose --workspace --exclude rustfs-erasure-codec-fuzz --target ${{ matrix.target }} --features simd-accel

  build-ppc64le-vsx:
    name: Build ppc64le VSX (nightly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7

      # The VSX backend is gated on `target_arch = "powerpc64"` and uses
      # still-unstable PowerPC intrinsics, so it only compiles on nightly for this
      # target and is invisible to the x86_64/aarch64 jobs. Cross-check it here so
      # a `simd-vsx` build breakage cannot go unnoticed again.
      - name: Install Rust nightly with ppc64le target
        uses: dtolnay/rust-toolchain@master # v1
        with:
          toolchain: nightly
          target: powerpc64le-unknown-linux-gnu
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1 # v2.9.1

      - name: Check VSX backend (no_std)
        run: cargo check -p rustfs-erasure-codec --target powerpc64le-unknown-linux-gnu --no-default-features --features simd-vsx

      - name: Check VSX backend (std)
        run: cargo check -p rustfs-erasure-codec --target powerpc64le-unknown-linux-gnu --features simd-vsx

      - name: Clippy VSX backend
        run: cargo clippy -p rustfs-erasure-codec --target powerpc64le-unknown-linux-gnu --features simd-vsx -- -D warnings

  test-linux:
    name: Test Linux (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QUICKCHECK_TESTS: 4
      QUICKCHECK_GENERATOR_SIZE: 32
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ stable, beta, nightly ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master # v1
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1 # v2.9.1

      - name: Test no_std
        run: cargo test --verbose -p rustfs-erasure-codec --no-default-features

      - name: Test no_std with SIMD
        run: cargo test --verbose -p rustfs-erasure-codec --no-default-features --features simd-accel

      - name: Test std + simd
        run: cargo test --verbose --workspace --exclude rustfs-erasure-codec-fuzz --features simd-accel

  test-linux-aarch64:
    name: Test Linux ARM64 (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      QUICKCHECK_TESTS: 4
      QUICKCHECK_GENERATOR_SIZE: 32
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ stable ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master # v1
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1 # v2.9.1

      - name: Test no_std
        run: cargo test --verbose -p rustfs-erasure-codec --no-default-features

      - name: Test no_std with SIMD
        run: cargo test --verbose -p rustfs-erasure-codec --no-default-features --features simd-accel

      - name: Test std + simd
        run: cargo test --verbose --workspace --exclude rustfs-erasure-codec-fuzz --features simd-accel

  test-windows-native:
    name: Test Windows Native (${{ matrix.toolchain }})
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QUICKCHECK_TESTS: 4
      QUICKCHECK_GENERATOR_SIZE: 32
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ stable, beta, nightly ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master # v1
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1 # v2.9.1

      - name: Test all crates
        run: cargo test --verbose --workspace --exclude rustfs-erasure-codec-fuzz

  test-macos-arm64:
    name: Test macOS ARM64 (${{ matrix.toolchain }})
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      QUICKCHECK_TESTS: 4
      QUICKCHECK_GENERATOR_SIZE: 32
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ stable ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master # v1
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1 # v2.9.1

      - name: Test no_std
        run: cargo test --verbose -p rustfs-erasure-codec --no-default-features

      - name: Test no_std with SIMD
        run: cargo test --verbose -p rustfs-erasure-codec --no-default-features --features simd-accel

      - name: Test std + simd
        run: cargo test --verbose --workspace --exclude rustfs-erasure-codec-fuzz --features simd-accel

  release-inputs:
    name: Validate controlled release evidence
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_preflight)
    outputs:
      evidence_ref: ${{ steps.input.outputs.evidence_ref }}
    env:
      RUSTFLAGS: ""
      EVIDENCE_REF: ${{ inputs.evidence_ref || vars.RSE_RELEASE_EVIDENCE_REF }}
    steps:
      - name: Require an immutable evidence commit
        id: input
        shell: bash
        run: |
          if [[ ! "$EVIDENCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Configure RSE_RELEASE_EVIDENCE_REF or evidence_ref with a full evidence commit.' >&2
            exit 1
          fi
          echo "evidence_ref=$EVIDENCE_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout candidate and baseline history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout evidence data
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.input.outputs.evidence_ref }}
          path: .release-evidence
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate source, digests, complete profiles, drift and regressions
        run: >-
          python3 scripts/release_evidence.py verify
          --manifest .release-evidence/release-evidence/manifest.json
          --report target/release-preflight/evidence-validation.json

      - name: Record evidence input outcome
        if: always()
        env:
          INPUT_STATUS: ${{ job.status }}
        run: |
          mkdir -p target/release-preflight
          python3 - <<'PYTHON'
          import json, os, pathlib
          pathlib.Path("target/release-preflight/input.json").write_text(json.dumps({
              "status": os.environ["INPUT_STATUS"], "candidate_commit": os.environ["GITHUB_SHA"],
              "evidence_ref": os.environ["EVIDENCE_REF"], "run_id": os.environ["GITHUB_RUN_ID"]}) + "\n")
          PYTHON

      - name: Upload evidence validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release-preflight/*.json
          if-no-files-found: warn

  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_preflight)
    needs:
      - release-inputs
      - typos
      - security
      - wasm-integration
      - release-tooling
      - build-linux
      - build-windows-native
      - build-windows-gnu-targets
      - test-linux
      - test-linux-aarch64
      - test-windows-native
      - test-macos-arm64
    env:
      RUSTFLAGS: ""
      VALIDATION_PROFILE: release
      RSE_RELEASE_EVIDENCE: .release-evidence/release-evidence/manifest.json

    steps:
      - name: Checkout candidate and baseline history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout validated evidence data
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-inputs.outputs.evidence_ref }}
          path: .release-evidence
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Verify release versions and optional tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            python3 scripts/check_release_manifest.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check_release_manifest.py
          fi

      - name: Release preflight checks
        run: bash scripts/release-check.sh

      - name: Record complete preflight outcome
        if: always()
        env:
          PREFLIGHT_STATUS: ${{ job.status }}
          EVIDENCE_REF: ${{ needs.release-inputs.outputs.evidence_ref }}
        run: |
          mkdir -p target/release-preflight
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          report = {"status": os.environ["PREFLIGHT_STATUS"], "profile": "release",
                    "candidate_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                    "candidate_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                    "evidence_ref": os.environ["EVIDENCE_REF"], "run_id": os.environ["GITHUB_RUN_ID"],
                    "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "ref": os.environ["GITHUB_REF"],
                    "registry_uploaded": False}
          pathlib.Path("target/release-preflight/preflight.json").write_text(json.dumps(report, indent=2) + "\n")
          PYTHON

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release-preflight/*.json
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - release-preflight
    env:
      RUSTFLAGS: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master # v1
        with:
          toolchain: stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2.9.1 # v2.9.1

      - name: Verify release tag and versions
        run: python3 scripts/check_release_manifest.py --tag "$GITHUB_REF_NAME"

      - name: Verify package
        run: cargo publish --dry-run --locked --registry crates-io --package rustfs-erasure-codec

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked --registry crates-io --package rustfs-erasure-codec
