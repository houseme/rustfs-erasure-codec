[workspace]
members = [".", "wasm", "fuzz", "xtask", "scripts/release-compatibility"]
default-members = [".", "wasm", "fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/houseme/rustfs-erasure-codec"

[workspace.dependencies]
cfg_aliases = "0.2.2"
codec_old = { package = "rustfs-erasure-codec", version = "=9.0.0", features = ["simd-accel"] }
codec_new = { package = "rustfs-erasure-codec", version = "=9.1.0", path = ".", features = ["simd-accel"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
csv = "1.4.0"
hashlink = { version = "0.12", default-features = false }
libfuzzer-sys = "0.4"
libm = "0.2.16"
libc = "0.2.191"
parking_lot = "0.13.0"
quickcheck = "1.1.0"
rand = "0.10.3"
rayon = "1.12.0"
regex = "1.13.1"
rustfs-erasure-codec = { version = "9.1.0", path = "." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
smallvec = "1.16.4"
spin = { version = "0.12.3", default-features = false, features = ["once", "spin_mutex"] }
toml = "1.1.8"
wasm-bindgen = "0.2.129"

# CI lint baseline (rustfs/backlog#1237, #1243). Members opt in via `[lints] workspace = true`.
# `undocumented_unsafe_blocks` is enabled (#1243); `missing_docs` is still staged.
# workspace.lints have lower priority than in-source attributes, so existing
# `#![allow(...)]` still applies.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"
noop_method_call = "warn"

[workspace.lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "warn"

[lints]
workspace = true

[package]
name = "rustfs-erasure-codec"
version = "9.1.0"
authors = ["houseme <housemecn@gmail.com>"]
edition.workspace = true
build = "build.rs"
include = [
    "/src/**/*.rs",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
]
description = "Rust implementation of Reed-Solomon erasure coding"
documentation = "https://docs.rs/rustfs-erasure-codec"
homepage = "https://github.com/houseme/rustfs-erasure-codec"
repository.workspace = true
readme = "README.md"
keywords = ["reed-solomon", "erasure"]
categories = ["encoding"]
license.workspace = true

[features]
default = ["std"] # simd and metrics off by default
std = ["parking_lot", "rayon"]
# Fine-grained SIMD backends — enable per-architecture as needed.
# Users on aarch64 should enable `simd-neon`; users on x86_64 should enable
# whichever ISA extensions their target supports.
simd-neon = []
simd-ssse3 = []
simd-avx2 = []
simd-avx512 = []
simd-gfni = []
# VSX is a pure-Rust backend (compile-time `target_feature = "vsx"` detection,
# nibble-lookup tables generated by build.rs).
simd-vsx = []
# Backwards-compatible umbrella: enables all SIMD backends.
simd-accel = ["simd-neon", "simd-ssse3", "simd-avx2", "simd-avx512", "simd-gfni", "simd-vsx"]
benchmark-metrics = []

[dependencies]
# `log2()` impl for `no_std`
libm.workspace = true
hashlink.workspace = true
# Efficient `Mutex` implementation for `std` environment
parking_lot = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
smallvec.workspace = true
# `Mutex` implementation for `no_std` environment with the same high-level API as `parking_lot`
spin.workspace = true

[dev-dependencies]
rand.workspace = true
quickcheck.workspace = true
# Scientific benchmarking
criterion.workspace = true

[build-dependencies]
cfg_aliases = { workspace = true }

[[bench]]
name = "bandwidth"
harness = false

[[bench]]
name = "throughput_matrix"
harness = false

[[bench]]
name = "galois_backend"
harness = false

[[bench]]
name = "recovery_paths"
harness = false
required-features = ["std"]

[[bench]]
name = "leopard_recovery_comparison"
harness = false
required-features = ["std"]

[[bench]]
name = "reconstruct_plans"
harness = false
required-features = ["std"]
